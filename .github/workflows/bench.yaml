# Every suite, every run, all of it into the job summary.
#
# Measures A, B and C read 100% at 3de6b009 (2026-10-04, measured under
# `nix develop`): 2189/2189 fixtures, 0 FAIL/unasserted/XFAIL; 612/612 LRM
# clauses and 808/808 IEEE 1364 clauses cited both ways or classified. So the
# suites GATE now: a change that drops any of them is a failed change.
# AGENTS.md §0 rule 3 still holds for reading a failure: the FAIL/XFAIL name
# list is uploaded as an artifact, diff names, not counts.
#
# Only the sweep and the audit-tool self-tests report without gating.
name: bench

on:
  push:
    branches: [main, zig-0.17]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast install

      # Audit-tool regression checks, not language-conformance evidence. The
      # IEEE extractor tests use synthetic text; no licensed PDF is uploaded.
      # Keep the project's existing unit-only gating policy.
      - name: Source audit tooling self-tests
        continue-on-error: true
        run: |
          python3 tools/conformance.py selftest 2>&1 | tee /tmp/source-audit.txt
          exit "${PIPESTATUS[0]}"

      # THE GATE. Gate on $?, not on reading the tail of a log — `zig build test
      # 2>&1 | tail` swallows the exit code and this has produced a green report
      # over a failing build before (TODO.md §2.1).
      - name: Unit tests (gate)
        run: |
          zig build test --summary all 2>&1 | tee /tmp/unit.txt
          exit "${PIPESTATUS[0]}"

      # Verdict prose (`FAIL <path>: why`) goes to stderr and the TSV tables go
      # to stdout, so both streams are merged into one log — conformance.py
      # parses the TSV and the name list below comes from the prose.
      - name: Verilog-AMS suite — every fixture, strict (measure A)
        run: |
          zig build test-ams 2>&1 | tee /tmp/strict.txt
          rc=${PIPESTATUS[0]}
          echo "strict exit: $rc" >> /tmp/strict.txt
          exit "$rc"

      # B and C: no clause may be one-way or uncited. The tool prints the tally
      # and exits 0 either way, so the gate reads the tally line.
      - name: LRM clause coverage (measure C)
        if: always()
        run: |
          zig build benchmark -- --coverage 2>&1 | tee /tmp/coverage.txt
          [ "${PIPESTATUS[0]}" = 0 ] || exit 1
          grep -q ' 0 positive citations only · 0 rejection citations only · 0 uncited ' /tmp/coverage.txt

      - name: IEEE 1364-2005 clause coverage (measure B)
        if: always()
        run: |
          zig build test-1364 -- --coverage 2>&1 | tee /tmp/coverage1364.txt
          [ "${PIPESTATUS[0]}" = 0 ] || exit 1
          grep -q ' 0 positive citations only · 0 rejection citations only · 0 uncited ' /tmp/coverage1364.txt

      - name: IEEE 1364-2005 suite
        if: always()
        run: |
          zig build test-1364 2>&1 | tee /tmp/ieee1364.txt
          exit "${PIPESTATUS[0]}"

      - name: Digital transcripts — 1364 plus the AMS digital-context cases
        if: always()
        run: |
          zig build test-devices 2>&1 | tee /tmp/devices.txt
          exit "${PIPESTATUS[0]}"

      - name: VPI .c fixtures compile
        if: always()
        run: zig build test-vpi-fixtures

      # Every .sp deck runs on sim.spice (ESPice's solver) and is graded against its
      # .expected.json oracle; any FAIL exits 1. NOT RUN is not a FAIL.
      - name: SPICE decks run against their oracles
        if: always()
        run: |
          zig build test-spice 2>&1 | tee /tmp/spice.txt
          exit "${PIPESTATUS[0]}"

      # --sweep is the footprint and speed scaling table: generated-device byte
      # counts and MIR footprint against fixture size. It compiles nothing from
      # tests/fixtures, so it is fast and it is the size-regression signal.
      - name: Benchmark sweep — footprint and speed
        continue-on-error: true
        run: zig build benchmark -- --sweep 2>&1 | tee /tmp/sweep.txt

      # The artifact AGENTS.md §0 rule 3 asks for: names, not counts. The
      # absolute path and the reason are stripped — both are noise in a diff,
      # and the reason changes whenever the diagnostic text is reworded.
      - name: Extract the FAIL / XFAIL name lists
        if: always()
        run: |
          grep -E '^(FAIL|XFAIL) ' /tmp/strict.txt \
            | sed 's|^\(X\?FAIL\) .*/tests/fixtures/|\1 |; s|:.*||' \
            | sort > failing-names.txt || true
          wc -l < failing-names.txt

      - name: Job summary
        if: always()
        env:
          STRICT_LOG: /tmp/strict.txt
          COVERAGE_LOG: /tmp/coverage.txt
        run: |
          {
            echo '## Conformance'
            echo
            python3 tools/conformance.py || echo '(conformance.py could not parse this run)'
            echo
            echo '## Verilog-AMS suite — verdicts'
            echo '```'; tail -40 /tmp/strict.txt; echo '```'
            echo '## Clause coverage'
            echo '```'; tail -6 /tmp/coverage.txt; echo '```'
            echo '## IEEE 1364-2005 clause coverage'
            echo '```'; tail -3 /tmp/coverage1364.txt; echo '```'
            echo '## IEEE 1364-2005 suite'
            echo '```'; tail -20 /tmp/ieee1364.txt; echo '```'
            echo '## SPICE decks'
            echo '```'; cat /tmp/spice.txt; echo '```'
            echo '## Digital transcripts'
            echo '```'; tail -20 /tmp/devices.txt; echo '```'
            echo '## Footprint and speed sweep'
            echo '```'; cat /tmp/sweep.txt; echo '```'
            echo '## Unit tests'
            echo '```'; tail -20 /tmp/unit.txt; echo '```'
            echo '## Source audit tooling (not conformance coverage)'
            echo '```'; cat /tmp/source-audit.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-logs
          path: |
            failing-names.txt
            /tmp/strict.txt
            /tmp/coverage.txt
            /tmp/coverage1364.txt
            /tmp/ieee1364.txt
            /tmp/devices.txt
            /tmp/spice.txt
            /tmp/sweep.txt
            /tmp/source-audit.txt

  # The consumer check ARPice asked for (2026-10-04): the device models it
  # ships compile to a host-loadable .so through this tree's vera, and the
  # contract ABI handshake (`contract.abi_version`, checked on every
  # --emit-so) passes. ARPice pins a VerA sha; this job catches a break
  # before ARPice re-pins onto it.
  arpice-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [diode, mos1, bsim4va, psp103, psp103_nqs, vbic13_4t]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarSiwy/ESPice
          path: arpice
          sparse-checkout: models
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build vera
        run: zig build -Doptimize=ReleaseFast install
      # The same no-op `dyn` module build.zig hands --emit-so for a .va device.
      - name: Compile ${{ matrix.model }}.va to a .so
        run: |
          printf 'pub fn exportDevice(comptime D: type, comptime name: []const u8) void {\n    _ = D;\n    _ = name;\n}\n' > dyn.zig
          ./zig-out/bin/vera --emit-so --contract tools/contract.zig --dyn dyn.zig -I arpice/models \
            --work-dir out arpice/models/${{ matrix.model }}.va
