# Every suite, every run, all of it into the job summary.
#
# Measures A, B and C read 100% at 3de6b009 (2026-10-04, measured under
# `nix develop`): 2189/2189 fixtures, 0 FAIL/unasserted/XFAIL; 612/612 LRM
# clauses and 808/808 IEEE 1364 clauses cited both ways or classified. So the
# suites GATE now: a change that drops any of them is a failed change.
# AGENTS.md §0 rule 3 still holds for reading a failure: the FAIL/XFAIL name
# list is uploaded as an artifact, diff names, not counts.
#
# Only the sweep and the audit-tool self-tests report without gating. Also
# gating (docs/TESTING.md §3.6): `zig build test` (which runs the canaries),
# the build-step inventory, the requirement ledger against the LRM text, the
# sentence cites against the ledger, and the verdict RATCHET: every fixture's
# verdict must equal the committed tests/fixtures/VERDICTS.tsv, so a
# regression fails by name and an improvement is committed by name
# (`tools/conformance.py ratchet --update`).
name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast install

      # Audit-tool regression checks, not language-conformance evidence. The
      # IEEE extractor tests use synthetic text; no licensed PDF is uploaded.
      # Keep the project's existing unit-only gating policy.
      - name: Source audit tooling self-tests
        continue-on-error: true
        run: |
          python3 tools/conformance.py selftest 2>&1 | tee /tmp/source-audit.txt
          exit "${PIPESTATUS[0]}"

      # THE GATE. Gate on $?, not on reading the tail of a log — `zig build test
      # 2>&1 | tail` swallows the exit code and this has produced a green report
      # over a failing build before (TODO.md §2.1).
      - name: Unit tests (gate)
        run: |
          zig build test --summary all 2>&1 | tee /tmp/unit.txt
          exit "${PIPESTATUS[0]}"

      - name: Build-step inventory (gate)
        run: python3 tools/conformance.py steps

      - name: Requirement ledger matches the LRM text (gate)
        run: python3 tools/conformance.py obligations

      # A sentence cite whose fixture polarity contradicts its row cannot be
      # evidence, and would inflate the metric (docs/TESTING.md §3.3).
      - name: Sentence cites agree with the ledger (gate)
        run: python3 tools/conformance.py lint-cites

      # Verdict prose (`FAIL <path>: why`) goes to stderr and the TSV tables go
      # to stdout, so both streams are merged into one log — conformance.py
      # parses the TSV and the name list below comes from the prose.
      # Measure A. The suite binary is run directly: the build runner truncates
      # a failed step's output (AGENTS.md §0 rule 3), and --strict exits 1
      # while any XFAIL remains. FAIL and unasserted must be 0; the XFAIL
      # names are gated against docs/known-gaps.txt below.
      - name: Verilog-AMS suite — every fixture, strict (measure A)
        run: |
          cmd=$(zig build benchmark -- --strict zzz-none 2>&1 | grep '^failed command:' | sed 's/^failed command: //')
          read -r suite vera _ <<< "$cmd"
          "$suite" "$vera" --strict --verdicts=/tmp/verdicts.tsv > /tmp/strict.out 2> /tmp/strict.err || true
          cat /tmp/strict.out /tmp/strict.err > /tmp/strict.txt
          awk -F'\t' '/^pass\tfail\tunasserted\txfail/ { getline; f = $2; u = $3; n++ }
            END { print "fail=" f, "unasserted=" u; exit !(n > 0 && f == 0 && u == 0) }' /tmp/strict.out

      # Membership, not counts: the run's verdicts against the committed list.
      - name: Verdict ratchet (gate)
        if: always()
        run: python3 tools/conformance.py ratchet --verdicts=/tmp/verdicts.tsv

      # Measures C and B: the inventories exit 0 either way; their one-way and
      # uncited clauses are gated by name below.
      - name: LRM clause coverage (measure C)
        if: always()
        run: |
          zig build benchmark -- --coverage 2>&1 | tee /tmp/coverage.txt
          exit "${PIPESTATUS[0]}"

      - name: IEEE 1364-2005 clause coverage (measure B)
        if: always()
        run: |
          zig build test-1364 -- --coverage 2>&1 | tee /tmp/coverage1364.txt
          exit "${PIPESTATUS[0]}"

      # The known gaps by name (AGENTS.md §0 rule 3): a new XFAIL or one-way
      # clause fails, and so does a fixed one until its line is deleted.
      - name: Known gaps match docs/known-gaps.txt
        if: always()
        run: |
          tools/known_gaps.sh /tmp/strict.err /tmp/coverage.txt /tmp/coverage1364.txt > failing-names.txt
          diff -u docs/known-gaps.txt failing-names.txt

      - name: IEEE 1364-2005 suite
        if: always()
        run: |
          zig build test-1364 2>&1 | tee /tmp/ieee1364.txt
          exit "${PIPESTATUS[0]}"

      - name: Digital transcripts — 1364 plus the AMS digital-context cases
        if: always()
        run: |
          zig build test-devices 2>&1 | tee /tmp/devices.txt
          exit "${PIPESTATUS[0]}"

      - name: VPI .c fixtures compile
        if: always()
        run: zig build test-vpi-fixtures

      # --emit-verilog's modules: verilator -Wall lint and an iverilog testbench each.
      # Ubuntu's verilator (5.020) has no rise/fall delays (RISEFALLDLY) and
      # rejects the emitted modules; nixpkgs' (5.050) is the version they are
      # linted against locally.
      - uses: cachix/install-nix-action@v31
        if: always()
      - name: Behavioural Verilog simulates and lints
        if: always()
        run: nix shell nixpkgs#verilator nixpkgs#iverilog -c zig build test-beh-verilog

      # Every .sp deck runs on sim.spice (ESPice's solver) and is graded against its
      # .expected.json oracle; any FAIL exits 1. NOT RUN is not a FAIL.
      - name: SPICE decks run against their oracles
        if: always()
        run: |
          zig build test-spice 2>&1 | tee /tmp/spice.txt
          exit "${PIPESTATUS[0]}"

      # --sweep is the footprint and speed scaling table: generated-device byte
      # counts and MIR footprint against fixture size. It compiles nothing from
      # tests/fixtures, so it is fast and it is the size-regression signal.
      - name: Benchmark sweep — footprint and speed
        continue-on-error: true
        run: zig build benchmark -- --sweep 2>&1 | tee /tmp/sweep.txt

      # The artifact AGENTS.md §0 rule 3 asks for: names, not counts. The
      # absolute path and the reason are stripped — both are noise in a diff,
      # and the reason changes whenever the diagnostic text is reworded.
      - name: Job summary
        if: always()
        env:
          STRICT_LOG: /tmp/strict.txt
          COVERAGE_LOG: /tmp/coverage.txt
        run: |
          {
            echo '## Conformance'
            echo
            python3 tools/conformance.py || echo '(conformance.py could not parse this run)'
            echo
            echo '## Verilog-AMS suite — verdicts'
            echo '```'; tail -40 /tmp/strict.txt; echo '```'
            echo '## Clause coverage'
            echo '```'; tail -6 /tmp/coverage.txt; echo '```'
            echo '## IEEE 1364-2005 clause coverage'
            echo '```'; tail -3 /tmp/coverage1364.txt; echo '```'
            echo '## IEEE 1364-2005 suite'
            echo '```'; tail -20 /tmp/ieee1364.txt; echo '```'
            echo '## SPICE decks'
            echo '```'; cat /tmp/spice.txt; echo '```'
            echo '## Digital transcripts'
            echo '```'; tail -20 /tmp/devices.txt; echo '```'
            echo '## Footprint and speed sweep'
            echo '```'; cat /tmp/sweep.txt; echo '```'
            echo '## Unit tests'
            echo '```'; tail -20 /tmp/unit.txt; echo '```'
            echo '## Source audit tooling (not conformance coverage)'
            echo '```'; cat /tmp/source-audit.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-logs
          path: |
            failing-names.txt
            /tmp/strict.txt
            /tmp/coverage.txt
            /tmp/coverage1364.txt
            /tmp/ieee1364.txt
            /tmp/devices.txt
            /tmp/spice.txt
            /tmp/sweep.txt
            /tmp/source-audit.txt
            /tmp/verdicts.tsv

  # The external analog suites (tools/external_analog.py): VerA's
  # `--emit-osdi` libraries in ngspice against hand-derived values,
  # OpenVAF-Reloaded, the CMC and TU Dresden QA references and Xyce, every
  # reference tool from `nix develop .#benchmarking`. It reports and does not
  # gate until every disagreement is triaged (each suite folder's TRIAGE.md);
  # the FAIL name list is the artifact (AGENTS.md §0 rule 3).
  external-analog:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build vera
        run: nix develop .#benchmarking -c zig build -Doptimize=ReleaseFast install
      - name: External analog suites (osdi, va-models, cmcqa, hicum-qa, xyce)
        run: |
          nix develop .#benchmarking -c python3 tools/external_analog.py --out external-out 2>&1 | tee external.txt
          exit "${PIPESTATUS[0]}"
      - name: Job summary
        if: always()
        run: |
          {
            echo '## External analog suites'
            echo '```'; tail -1 external.txt; echo '```'
            echo '### FAIL names'
            echo '```'; cat external-out/fail.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-analog
          path: |
            external.txt
            external-out/fail.txt

  # Cross-platform builds hold because VerA calls no OS but through `std`
  # (tests/exhaustive.zig's portability guard; lib/dynlib.zig is the one
  # allowlisted file). `build-all` compiles every artifact `test` builds, the
  # emitted test devices and the VPI host and applications included, for the
  # target, and runs none: a foreign binary cannot run on this runner.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-gnu, aarch64-linux-gnu, x86_64-macos, aarch64-macos, x86_64-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build every artifact for ${{ matrix.target }}
        run: zig build build-all -Dtarget=${{ matrix.target }}

  # The flake (AGENTS.md "Nix"): the source package, its smoke check (a
  # resistor through `vera --check` in the sandbox) and the latest release
  # binary's, all built by `nix flake check`.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L
      - name: nix build .#default
        run: nix build -L .#default

  # The gate, run where the cross job can only compile.
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Unit tests (gate)
        shell: bash
        run: |
          zig build test --summary all 2>&1 | tee unit.txt
          exit "${PIPESTATUS[0]}"

  # The conformance and speed report (tools/report.py): one self-contained
  # page with the measures, the clause-by-clause rule map, the gaps, and the
  # timing charts, re-measured from scratch in ReleaseFast (the suites job
  # above builds its suite Debug, whose timings are not the shipping number).
  # Main only: it is a published record, not a gate.
  report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarSiwy/ESPice
          path: arpice
          sparse-checkout: models
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Generate report/
        run: |
          python3 tools/report.py --selftest
          python3 tools/report.py --models arpice/models
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: report/

  # Publishes the report to GitHub Pages. Needs Settings > Pages > Source set
  # to "GitHub Actions" once; until then this job fails and nothing else does.
  pages:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # The consumer check: build ARPice (OmarSiwy/ESPice) against THIS VerA
  # commit, the way ARPice ships it (2026-10-04, agreed with ARPice).
  # Its build.zig compiles every models/*.va through VerA into host objects
  # built from its own src/device/eval.zig dyn, so a contract, validateHost or
  # ABI failure is a compile error, and the link resolves each device's
  # arp_device_<stem>. `zig build test` then runs ARPice's unit suites and
  # its numeric deck corpus. CPU only (-Dgpu=false).
  # VerA goes where ESPice's build.zig.zon expects it: `../vera-pin1` while
  # ESPice pins a path; `--fork` once it pins a git URL (an unmatched --fork
  # is a Zig error, so the two are exclusive).
  # ESPICE_REF (repo variable, Settings > Variables) pins the ESPice commit to
  # build; the job is skipped until it is set. ESPice main (16781d6e) is the
  # Zig 0.16 release and cannot build on 0.17; the 0.17 tree is branch step1.
  arpice-consumer:
    if: vars.ESPICE_REF != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: vera-pin1
      - uses: actions/checkout@v4
        with:
          repository: OmarSiwy/ESPice
          ref: ${{ vars.ESPICE_REF }}
          path: espice
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build ARPice against this VerA (compiles the model corpus)
        working-directory: espice
        run: |
          fork=()
          grep -q 'vera-pin1' build.zig.zon || fork=("--fork=$GITHUB_WORKSPACE/vera-pin1")
          zig build -Dgpu=false "${fork[@]}"
      - name: ARPice unit suites and deck corpus
        working-directory: espice
        run: |
          fork=()
          grep -q 'vera-pin1' build.zig.zon || fork=("--fork=$GITHUB_WORKSPACE/vera-pin1")
          zig build test -Dgpu=false "${fork[@]}"
